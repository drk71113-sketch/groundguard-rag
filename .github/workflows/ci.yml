name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install "uv==0.12.9"
      - name: Sync locked test and MCP extras
        run: uv sync --locked --extra test --extra mcp --python ${{ matrix.python-version }}
      - name: Check dependencies
        run: uv pip check
      - name: Lint correctness rules
        run: uv run ruff check src tests examples
      - name: Test with branch coverage
        run: uv run python -m pytest -q -W error --cov=groundguard_rag --cov-branch --cov-report=term-missing
      - name: Run local integration demo
        run: uv run python examples/quickstart_local.py > /dev/null
      - name: Run local evaluation demo
        run: uv run python -m groundguard_rag.evaluation.cli --factory examples.demo_factory:build_groundguard --dataset examples/sample_benchmark.jsonl > /dev/null

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "uv==0.12.9"
      - run: uv sync --locked --extra test --python 3.11
      - run: uv run python -m build
      - name: Verify wheel contents
        shell: python
        run: |
          import pathlib
          import zipfile

          wheel = next(pathlib.Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
              entry_points = [
                  name for name in names if name.endswith("entry_points.txt")
              ]
              assert len(entry_points) == 1
              entry_point_text = archive.read(entry_points[0]).decode("utf-8")
          assert "groundguard_rag/schema/audit_report.v1.schema.json" in names
          assert "groundguard-rag-mcp" in entry_point_text
          assert "groundguard-rag-eval" in entry_point_text
